<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محتوى Spartacus Community</title><style>body{font:16px/1.7 system-ui,Tahoma,Arial;background:#f6f6f6;color:#222;margin:0}header{background:#191919;color:white;padding:20px 5%;border-bottom:4px solid #df0000}header a{color:white}main{max-width:1050px;margin:auto;padding:24px 5%}button,select{padding:10px;border:1px solid #ccc;border-radius:8px;background:white}button{cursor:pointer}button[aria-pressed=true]{background:#d00;color:white}nav{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px}.card img{width:100%;height:170px;object-fit:contain}.card a{color:#ba0000}#status{min-height:25px}</style><header><a href="/">← Spartacus Community</a><h1>آخر مقالات ومنتجات Spartacus</h1></header><main><nav><button data-type="posts" aria-pressed="true">المقالات</button><button data-type="products" aria-pressed="false">المنتجات</button><button data-type="offers" aria-pressed="false">العروض</button></nav><p><label>اللغة <select id="lang"><option value="ar">العربية</option><option value="en">English</option></select></label> <button id="refresh">تحديث</button></p><p id="status" role="status"></p><section id="cards" class="cards"></section></main><script>
'use strict';const SITE='https://spartacusprotein.com',cards=document.querySelector('#cards'),status=document.querySelector('#status'),lang=document.querySelector('#lang');let type='posts',abort;
function safe(u){try{let x=new URL(u,SITE);return x.protocol==='https:'&&(x.hostname==='spartacusprotein.com'||x.hostname.endsWith('.spartacusprotein.com'))?x.href:'#'}catch{return '#'}}
function plain(html){let d=document.createElement('div');d.innerHTML=html||'';return d.textContent||''}
function render(item){let el=document.createElement('article');el.className='card';if(item.img){let im=document.createElement('img');im.src=safe(item.img);im.loading='lazy';im.alt='';el.append(im)}let h=document.createElement('h2'),a=document.createElement('a');a.href=safe(item.url);a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title;h.append(a);let p=document.createElement('p');p.textContent=item.desc.slice(0,220);el.append(h,p);cards.append(el)}
async function load(){abort?.abort();abort=new AbortController();cards.replaceChildren();status.textContent='جاري التحديث...';try{let path=type==='posts'?'/wp-json/wp/v2/posts?per_page=50&_embed=1&orderby=modified&order=desc':'/wp-json/wc/store/v1/products?per_page=24'+(type==='offers'?'&on_sale=true':'');let res=await fetch(SITE+path,{signal:abort.signal,cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let rows=await res.json();if(type==='posts'){rows=rows.filter(x=>{let p=new URL(x.link).pathname;return lang.value==='ar'?p.startsWith('/ar/'):!p.startsWith('/ar/')}).slice(0,12).map(x=>({title:plain(x.title?.rendered),desc:plain(x.excerpt?.rendered),url:x.link,img:x._embedded?.['wp:featuredmedia']?.[0]?.source_url}))}else{rows=rows.map(x=>({title:plain(x.name),desc:plain(x.short_description||x.description),url:x.permalink,img:x.images?.[0]?.src}))}rows.forEach(render);status.textContent=rows.length?'آخر تحديث: '+new Date().toLocaleTimeString('ar-JO'):'لا يوجد محتوى متاح حالياً.'}catch(e){if(e.name==='AbortError')return;status.textContent='تعذر الاتصال بالموقع من التطبيق. قد تكون هناك قيود CORS أو إعدادات API.';let a=document.createElement('a');a.href=SITE;a.textContent='فتح الموقع الرسمي';cards.append(a)}}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));load()});document.querySelector('#refresh').onclick=load;lang.onchange=()=>{document.documentElement.lang=lang.value;document.documentElement.dir=lang.value==='ar'?'rtl':'ltr';load()};load();
</script></html>
